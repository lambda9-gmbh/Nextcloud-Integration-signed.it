[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.openapi]
command = "bash"
args = ["scripts/openapi-mcp.sh"]

[mcp_servers.postgres]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-postgres",
    "postgres://nextcloud:nextcloud@localhost:5433/nextcloud",
]
